name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: kos
          POSTGRES_PASSWORD: kos
          POSTGRES_DB: kos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kos -d kos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      KOS_TEST_DATABASE_URL: postgresql+psycopg://kos:kos@localhost:5432/kos_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target app -t kos-backend ./backend
      - run: docker build --target worker -t kos-worker ./backend
      - run: docker build -t kos-web ./web
      - run: docker run --rm -v "$PWD/gateway:/etc/caddy:ro" caddy:2.8.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: cp .env.example .env && sed -i "s/^KOS_DB_PASSWORD=$/KOS_DB_PASSWORD=ci/" .env && docker compose config -q
